apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplite-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: shoplite
    app.kubernetes.io/part-of: shoplite
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # ArgoCD Multi-Source Pattern: Helm Chart from shoplite-app + Overrides from shoplite-gitops
  sources:
    - repoURL: https://github.com/DevMahbubHussain/shoplite-app.git
      targetRevision: main
      path: helm/shoplite
      helm:
        valueFiles:
          - $values/envs/prod/values.yaml

    - repoURL: https://github.com/DevMahbubHussain/shoplite-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: shoplite

  # Production Manual Promotion Gate (Constraint C2 & Roadmap Phase 3B)
  # Requires human review or release pipeline approval before syncing to live cluster
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
