apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplite-app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/name: shoplite
    app.kubernetes.io/part-of: shoplite
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/DevMahbubHussain/shoplite-gitops.git
    targetRevision: main
    path: apps/argocd-applications
    directory:
      recurse: false
      exclude: "app-of-apps.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
